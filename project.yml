name: RPGPlayer
options:
  bundleIdPrefix: com.rpgplayer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  RPGPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RPGPlayer
    resources:
      - path: RPGPlayer/Resources
    settings:
      # ── Identity ────────────────────────────────────────────────────────
      PRODUCT_NAME: RPGPlayer
      PRODUCT_BUNDLE_IDENTIFIER: com.rpgplayer.app
      SWIFT_VERSION: "5.9"

      # ── Deployment ──────────────────────────────────────────────────────
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1,2"

      # ── Info.plist — generated by Xcode (không dùng file template rỗng) ─
      # Xcode 13+ tự tạo Info.plist đầy đủ từ các INFOPLIST_KEY_* bên dưới.
      # CFBundleExecutable được inject tự động = $(EXECUTABLE_NAME) = PRODUCT_NAME.
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "RPG Player"
      INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "RPG Player cần quyền truy cập file game của bạn."
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      INFOPLIST_KEY_UIStatusBarHidden: NO
      INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

      # ── Signing ─────────────────────────────────────────────────────────
      CODE_SIGN_STYLE: Manual

      # ── Platform / Catalyst ─────────────────────────────────────────────
      SUPPORTS_MACCATALYST: NO
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

      # ── Other ───────────────────────────────────────────────────────────
      ENABLE_HARDENED_RUNTIME: YES
      SWIFT_STRICT_CONCURRENCY: targeted

      # ── mruby / C interop ───────────────────────────────────────────────
      # Bridging header exposes mruby C API + RGSS bridge functions to Swift.
      # Path is relative to $(SRCROOT).
      SWIFT_OBJC_BRIDGING_HEADER: RPGPlayer/EngineRGSS/RPGPlayer-Bridging-Header.h

      # HEADER_SEARCH_PATHS: mruby-headers/ is created by Scripts/build_mruby.sh
      # in CI (and must exist before xcodegen runs).
      HEADER_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/Frameworks/mruby-headers

    dependencies:
      - package: ZIPFoundation
      # mruby static XCFramework — built by Scripts/build_mruby.sh in CI.
      # embed: false because it is a static library (no dylib to embed).
      - framework: Frameworks/mruby.xcframework
        embed: false
      # Metal + MetalKit for sprite rendering (SpriteRenderer.swift)
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      # GameController for physical gamepad support (M2: GamepadManager.swift)
      - sdk: GameController.framework
      # JavaScriptCore for safe plugins.js parsing (M4: PluginManager.swift)
      - sdk: JavaScriptCore.framework
    scheme:
      testTargets:
        - RPGPlayerTests

  RPGPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RPGPlayerTests
    dependencies:
      - target: RPGPlayer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rpgplayer.tests
      SWIFT_VERSION: "5.9"
